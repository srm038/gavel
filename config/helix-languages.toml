[[language]]
name = "yaml"
language-servers = ["yaml-language-server"]

[language-server.yaml-language-server]
command = "yaml-language-server"

[language-server.yaml-language-server.config]
yaml = { schemas = { "node_modules/gavel/schemas/minutes.schema.yml" = ["*.minutes.yml"], "node_modules/gavel/schemas/agenda.schema.yml" = ["*.agenda.yml"], "node_modules/gavel/schemas/committee.schema.yml" = ["*.committee.yml"] } }
